# Blueprint do Render. Aplicar por Dashboard → Blueprints → New Blueprint.
#
# Só declara o que foi verificado. Chave inventada faz o deploy falhar por
# motivo invisível de fora — foi o que aconteceu no projeto anterior com
# `dockerBuildArgs`, que não existe.
services:
  - type: web
    name: legislacao-mesquita
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile

    # `healthCheckPath` fica de fora DE PROPÓSITO, e isto foi medido.
    #
    # O Render faz GET no caminho declarado e só considera o serviço saudável
    # com 2xx/3xx. O endpoint MCP responde:
    #
    #     GET  /mcp  → 406 Not Acceptable  ("Client must accept text/event-stream")
    #     GET  /     → 404
    #     POST /mcp  → 200
    #
    # Ou seja: não existe caminho que responda 2xx a um GET. Declarar
    # `healthCheckPath: /mcp` — como estava aqui antes — deixaria o serviço
    # eternamente "unhealthy", e o deploy falharia sem dizer por quê.
    #
    # Sem a chave, o Render considera o serviço no ar quando o processo passa a
    # escutar na porta, que é o comportamento correto para este servidor.

    envVars:
      # Preenchidos DEPOIS do primeiro deploy, quando o endereço público
      # existir. Sem eles o servidor recusa toda requisição externa com 421 —
      # é a proteção contra DNS rebinding, e a comparação de Host é exata.
      - key: LEGIS_DOMINIOS
        sync: false
      # Ativa o fluxo OAuth, que o ChatGPT exige para aceitar um conector.
      # O Claude conecta sem ele.
      - key: LEGIS_URL_PUBLICA
        sync: false
      - key: LEGIS_SEGREDO_OAUTH
        generateValue: true
